<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>What's On</title>
<meta name="description" content="Concerts, theatre, football and ballet in London and nearby.">
<meta name="theme-color" content="#1f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="bar">
    <h1>What's On</h1>
    <span id="updated"></span>
  </div>
  <div class="controls" id="controls">
    <input id="search" type="search" placeholder="Search artists, shows, teams, venues…" autocomplete="off" enterkeyhint="search">
    <div class="chips" id="cats"></div>
    <div class="filters">
      <select id="when" aria-label="When">
        <option value="any">Any time</option>
        <option value="today">Today</option>
        <option value="weekend">This weekend</option>
        <option value="week">Next 7 days</option>
        <option value="month">Next 30 days</option>
        <option value="date">Pick a date…</option>
      </select>
      <input id="date" type="date" aria-label="Date" hidden>
      <select id="area" aria-label="Where">
        <option value="all">London + day trips</option>
        <option value="london">London only</option>
        <option value="trips">Day trips only</option>
      </select>
    </div>
  </div>
</header>

<main>
  <p id="count" class="count">Loading events…</p>
  <ul id="list" class="list"></ul>
  <button id="more" class="more" hidden>Show more</button>
</main>

<nav class="tabs">
  <button data-tab="all" class="on">Discover</button>
  <button data-tab="saved">Saved <span id="savedCount"></span></button>
</nav>

<div id="sheet" class="sheet" hidden></div>

<script src="app.js"></script>
</body>
</html>
